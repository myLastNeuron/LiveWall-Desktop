name: LW-2 installer diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fix/lw-2-runtime-probe

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose .NET 8 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $dotnetRoot = Join-Path $env:ProgramFiles 'dotnet'
          Get-Process dotnet, VBCSCompiler, MSBuild -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1
          foreach ($framework in 'Microsoft.WindowsDesktop.App', 'Microsoft.NETCore.App') {
            $dir = Join-Path $dotnetRoot "shared\$framework"
            Get-ChildItem $dir -Directory -ErrorAction SilentlyContinue |
              Where-Object { [version]::TryParse($_.Name, [ref]$null) -and $_.Name -like '8.*' } |
              Remove-Item -Recurse -Force -ErrorAction Continue
          }
          "--- runtimes before ---"
          & dotnet --list-runtimes
          "--- uninstall 8.x MSI products ---"
          $roots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          $products = foreach ($root in $roots) {
            Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object {
              $props = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
              if ($props.DisplayName -match '^Microsoft (Windows Desktop Runtime|\.NET Runtime) - 8\.') {
                [pscustomobject]@{ Code = $_.PSChildName; Name = $props.DisplayName }
              }
            }
          }
          $products | Format-Table -AutoSize
          foreach ($product in $products) {
            $msiLog = Join-Path $env:RUNNER_TEMP ("uninstall-" + ($product.Code -replace '[{}]', '') + ".log")
            $u = Start-Process msiexec.exe -ArgumentList '/x', $product.Code, '/qn', '/norestart', '/l*v', $msiLog -Wait -PassThru
            "uninstall $($product.Name) [$($product.Code)] exit $($u.ExitCode)"
            if (Test-Path $msiLog) { Get-Content $msiLog -Tail 15 }
            $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\$($product.Code)"
            "registry key exists after uninstall: $(Test-Path $regPath)"
          }
          "--- uninstall 8.x Burn bundles ---"
          $bundles = Get-ChildItem (Join-Path $env:ProgramData 'Package Cache') -Recurse -Filter '*-8.*-win-x64.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(windowsdesktop|dotnet)-runtime-8\.' }
          $bundles | Select-Object FullName
          foreach ($bundle in $bundles) {
            $blog = Join-Path $env:RUNNER_TEMP ("bundle-uninstall-" + $bundle.Name + ".log")
            $u = Start-Process -FilePath $bundle.FullName -ArgumentList '/uninstall', '/quiet', '/norestart', '/log', $blog -Wait -PassThru
            "bundle uninstall $($bundle.Name) exit $($u.ExitCode)"
            if (Test-Path $blog) { Select-String -Path $blog -Pattern 'Detect complete|exit code|i007|i500' | Select-Object -Last 5 | ForEach-Object { $_.Line } }
          }
          "--- 8.x ARP entries after bundle uninstall ---"
          $roots2 = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )
          foreach ($root in $roots2) {
            Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object {
              $props = Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue
              if ($props.DisplayName -match '^Microsoft (Windows Desktop Runtime|\.NET Runtime) - 8\.') { "$($_.PSChildName) $($props.DisplayName)" }
            }
          }
          "--- download ---"
          $exe = Join-Path $env:RUNNER_TEMP 'dotnet8.exe'
          Invoke-WebRequest 'https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe' -OutFile $exe -UseBasicParsing
          Get-Item $exe | Select-Object Name, Length, VersionInfo
          Get-FileHash $exe -Algorithm SHA256
          "--- install ---"
          $log = Join-Path $env:RUNNER_TEMP 'dotnet8-install.log'
          $p = Start-Process -FilePath $exe -ArgumentList '/install', '/quiet', '/norestart', '/log', $log -Wait -PassThru
          "exit code: $($p.ExitCode)"
          "--- runtimes after ---"
          & dotnet --list-runtimes
          Get-ChildItem (Join-Path $dotnetRoot 'shared\Microsoft.WindowsDesktop.App') -Directory -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem (Join-Path $dotnetRoot 'shared\Microsoft.NETCore.App') -Directory -ErrorAction SilentlyContinue | Select-Object Name
          "--- installer log ---"
          if (Test-Path $log) { Get-Content $log -Tail 300 } else { 'NO LOG FILE' }
          "--- burn logs ---"
          Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem $env:TEMP -Filter 'dotnet*.log' -ErrorAction SilentlyContinue | Select-Object FullName, Length
